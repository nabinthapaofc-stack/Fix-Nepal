<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Nepal - Citizen Dashboard</title>
   
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/requests.css">
</head>
<body>
    <div class="app-container">
      
        <header class="app-header">
            <div class="logo">
                <h1>Fix Nepal</h1>
                <p>Citizen Dashboard</p>
            </div>
            <nav class="main-nav">
                <ul>
                    <li class="active" data-section="all-issues">All Issues</li>
                    <li data-section="my-requests">My Requests</li>
                </ul>
            </nav>
            <div class="user-info">
                <span class="user-name">नागरिक</span>
            </div>
        </header>

        <main class="main-content">
            <section class="issues-section" id="all-issues">
                <div class="section-header">
                    <h2>Reported Issues</h2>
                </div>
                
                <div class="issues-list">
                   
                    <div class="issue-card">
                        <div class="issue-header">
                            <h3 class="issue-title">Big pothole near school</h3>
                            <span class="status-badge status-pending">Pending</span>
                        </div>
                        <div class="issue-details">
                            <p class="issue-date">
                                <span class="detail-label">Reported:</span>
                                <span class="detail-value">Dec 6, 2025 at 11:30 AM</span>
                            </p>
                            <p class="issue-location">
                                <span class="detail-label">Location:</span>
                                <span class="detail-value">Near ABC School, Kathmandu</span>
                            </p>
                        </div>
                    </div>

                    <div class="issue-card">
                        <div class="issue-header">
                            <h3 class="issue-title">Broken street light</h3>
                            <span class="status-badge status-in-progress">In Progress</span>
                        </div>
                        <div class="issue-details">
                            <p class="issue-date">
                                <span class="detail-label">Reported:</span>
                                <span class="detail-value">Dec 5, 2025 at 3:45 PM</span>
                            </p>
                            <p class="issue-location">
                                <span class="detail-label">Location:</span>
                                <span class="detail-value">Main Road, Patan</span>
                            </p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
