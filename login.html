<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix नेपाल - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f9ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 { color: #1e40af; text-align: center; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 25px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: #1e40af;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background: #1e3a8a; }
        .signup-link { text-align: center; margin-top: 15px; color: #6b7280; }
        a { color: #166534; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>FixNepal Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
         
        <button onclick="handleLogin()">Login</button>
        <div class="signup-link">Don't have an account? <a href="signup.html">Sign Up</a></div>
    </div>

    <script>
        function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            
            if (email && password) {
                
                window.location.href = 'dashboard.html';
            } else {
                alert('Please fill in all fields');
            }
        }
    </script>
</body>
</html>
