<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixNepal - Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f9ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .signup-box {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 { color: #1e40af; text-align: center; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 25px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: #166534;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background: #14532d; }
        .login-link { text-align: center; margin-top: 15px; color: #6b7280; }
        a { color: #1e40af; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="signup-box">
        <h2>FixNepal Sign Up</h2>
        <input type="text" placeholder="Username">
        <input type="text" placeholder="Full Name">
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <button>Sign Up</button>
        <div class="login-link">Already have an account? <a href="#">Login</a></div>
    </div>
</body>
</html>
